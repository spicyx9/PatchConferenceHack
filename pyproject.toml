[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "conferge"
version = "0.1.0"
description = "Goal-driven conference trip opportunity optimizer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
  "httpx>=0.27,<1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "falkordb==1.8.0",
  "pyairbnb==2.2.2",
  "fast-flights==3.1.0",
  "flights==0.9.0",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["conferge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", ".git", "probes", "fixtures"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
