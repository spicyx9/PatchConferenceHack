name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --group dev
      - name: Bash syntax check
        run: bash -n scripts/ops/*.sh scripts/create_worktrees.sh
      - name: Ruff check
        run: uv run ruff check .
      - name: Pytest offline
        run: uv run pytest -q
