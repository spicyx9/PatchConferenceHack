# Codex CLI project config: autonomous runs inside the workspace, no approval prompts,
# network allowed for package installs and provider APIs. Destructive git operations
# are forbidden by CLAUDE.md rule 8 and reviewed at PR time.
approval_policy = "never"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
network_access = true

[features]
multi_agent = true

[agents]
max_threads = 4
